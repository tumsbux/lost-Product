name: Weekly Dead Stock & Visual Adj Rebuild

on:
  schedule:
    - cron: '0 2 * * 0'   # Sundays 02:00 UTC = 09:00 BKK
  workflow_dispatch:       # manual trigger from GitHub Actions tab

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: weekly-rebuild
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout lost-Product
        uses: actions/checkout@v4.2.2
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install mysql-connector-python

      - name: Create db_config.json from secrets
        env:
          DB_HOST:     ${{ secrets.DB_HOST }}
          DB_PORT:     ${{ secrets.DB_PORT }}
          DB_USER:     ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          GH_PAT:      ${{ secrets.GH_PAT }}
        run: |
          python3 -c "
          import json, os
          cfg = {
              'host':         os.environ['DB_HOST'],
              'port':         int(os.environ.get('DB_PORT', '13306')),
              'user':         os.environ['DB_USER'],
              'password':     os.environ['DB_PASSWORD'],
              'database':     os.environ['DB_DATABASE'],
              'github_token': os.environ['GH_PAT'],
              'github_repo':  'tumsbux/lost-Product'
          }
          json.dump(cfg, open('db_config.json', 'w'))
          print('db_config.json created')
          "

      - name: Build dead stock data
        continue-on-error: true
        timeout-minutes: 20
        run: python build_dead_stock.py --no-push

      - name: Build visual adjustment data
        continue-on-error: true
        timeout-minutes: 15
        run: python build_visual_adj.py --no-push

      - name: Commit and push rebuilt JSON files
        run: |
          git config user.email "bot@dashboard"
          git config user.name "Dashboard Bot"
          git add dead_stock_data.json visual_adj_data.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes — data identical to last build"
          else
            DATE=$(TZ=Asia/Bangkok date +%Y-%m-%d)
            git commit -m "auto: weekly rebuild dead-stock + visual-adj ${DATE}"
            git push
            echo "OK pushed"
          fi

      - name: Clean up credentials
        if: always()
        run: rm -f db_config.json
