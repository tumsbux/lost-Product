name: Daily GP Analysis & Lost Product Rebuild

on:
  # Triggered exclusively via cron-job.org at 10:00 AM BKK
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: daily-gp-rebuild
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout lost-Product
        uses: actions/checkout@v4.2.2
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install mysql-connector-python pandas pyarrow

      - name: Create db_config.json from secrets
        env:
          DB_HOST:     ${{ secrets.DB_HOST }}
          DB_PORT:     ${{ secrets.DB_PORT }}
          DB_USER:     ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          GH_PAT:      ${{ secrets.GH_PAT }}
        run: |
          python3 -c "
          import json, os
          cfg = {
              'host':         os.environ['DB_HOST'],
              'port':         int(os.environ.get('DB_PORT', '13306')),
              'user':         os.environ['DB_USER'],
              'password':     os.environ['DB_PASSWORD'],
              'database':     os.environ['DB_DATABASE'],
              'github_token': os.environ['GH_PAT'],
              'github_repo':  'tumsbux/lost-Product'
          }
          json.dump(cfg, open('db_config.json', 'w'))
          print('db_config.json created')
          "

      - name: Build GP analysis data
        run: python build_gp_analysis.py --no-push

      - name: Restore parquet cache
        run: |
          git fetch origin cache
          git checkout FETCH_HEAD -- cache/
          git reset HEAD cache/ 2>/dev/null || true
          echo "Cache files restored:"
          ls cache/

      - name: Build lost product data
        continue-on-error: true
        timeout-minutes: 20
        run: python build_lost_product_data.py

      - name: Commit and push rebuilt JSON
        run: |
          git config user.email "bot@dashboard"
          git config user.name "Dashboard Bot"
          git reset HEAD cache/ 2>/dev/null || true
          git add gp_analysis_data.json lost_product_data.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes — data identical to last build"
          else
            DATE=$(TZ=Asia/Bangkok date +%Y-%m-%d)
            git commit -m "auto: daily rebuild gp-analysis + lost-product ${DATE}"
            git pull --rebase origin main
            git push
            echo "OK pushed"
          fi

      - name: Clean up credentials
        if: always()
        run: rm -f db_config.json
