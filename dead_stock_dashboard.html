<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dead Stock Dashboard</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--border:#e0e4ea;--text:#2c3e50;--muted:#7f8c9a;--red:#e74c3c;--orange:#e67e22;--blue:#2e86ab;--green:#27ae60;--purple:#8e44ad}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--text);font-size:13px}
/* header */
.hdr{background:#1a252f;color:#fff;padding:12px 20px;display:flex;align-items:center;gap:16px}
.hdr h1{font-size:16px;font-weight:600}
.hdr .sub{font-size:12px;color:#aab;margin-left:auto}
/* kpi */
.kpi-row{display:flex;gap:12px;padding:14px 20px;flex-wrap:wrap}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:12px 18px;min-width:160px;flex:1}
.kpi .label{font-size:11px;color:var(--muted);margin-bottom:4px}
.kpi .value{font-size:22px;font-weight:700}
.kpi.red .value{color:var(--red)}
.kpi.orange .value{color:var(--orange)}
.kpi.blue .value{color:var(--blue)}
/* filters */
.filters{display:flex;gap:10px;padding:0 20px 12px;flex-wrap:wrap;align-items:center}
.filters select,.filters input{border:1px solid var(--border);border-radius:6px;padding:6px 10px;font-size:12px;background:#fff;color:var(--text)}
.filters label{font-size:12px;color:var(--muted)}
.btn{border:none;border-radius:6px;padding:6px 14px;font-size:12px;cursor:pointer;font-weight:500}
.btn-clear{background:#ecf0f1;color:var(--text)}
.btn-xlsx{background:#27ae60;color:#fff}
/* table */
.tbl-wrap{padding:0 20px 40px;overflow-x:auto}
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:8px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.08)}
thead th{background:#2c3e50;color:#fff;padding:9px 10px;text-align:left;font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap;user-select:none}
thead th:hover{background:#34495e}
thead th.r,tbody td.r,tfoot td.r{text-align:right}
thead th.sort-asc::after{content:' ▲'}
thead th.sort-desc::after{content:' ▼'}
tbody tr{border-bottom:1px solid var(--border)}
tbody tr:hover{background:#f8f9fa}
tbody tr.detail-row{background:#f0f4f8}
tbody td{padding:7px 10px;vertical-align:top}
.expand-btn{cursor:pointer;color:var(--blue);font-size:11px;margin-right:4px;user-select:none}
.badge{display:inline-block;border-radius:10px;padding:1px 7px;font-size:11px;font-weight:600;color:#fff}
.d90{background:var(--orange)}
.d180{background:var(--red)}
.d365{background:#8e44ad}
.never{background:#636e72}
tfoot td{padding:8px 10px;font-weight:700;background:#ecf0f1;border-top:2px solid var(--border)}
/* store sub-table */
.sub-tbl{width:100%;margin-top:4px;border-collapse:collapse;font-size:11px}
.sub-tbl th{background:#dde3ea;padding:4px 8px;text-align:left;font-weight:500}
.sub-tbl th.r,.sub-tbl td.r{text-align:right}
.sub-tbl td{padding:3px 8px;border-bottom:1px solid #e8ecf0}
.sub-tbl tr:last-child td{border-bottom:none}
/* no-data */
.no-data{text-align:center;padding:40px;color:var(--muted)}
/* loading */
#loading{position:fixed;inset:0;background:rgba(255,255,255,.85);display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--muted);z-index:999}

/* AI Analysis bar */
.ai-bar{background:linear-gradient(135deg,#f3e8ff,#fce7f3);padding:8px 18px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-bottom:1px solid #e9d5ff}
.ai-label{font-size:11px;font-weight:800;color:#6b21a8;letter-spacing:.3px;display:inline-flex;align-items:center;gap:4px}
.ai-btn{border:none;border-radius:18px;padding:6px 14px;font-size:12px;font-weight:600;cursor:pointer;color:#fff;background:linear-gradient(135deg,#a855f7,#6366f1);box-shadow:0 1px 3px rgba(99,102,241,.2);font-family:inherit;display:inline-flex;gap:4px;align-items:center;transition:transform .12s,box-shadow .12s}
.ai-btn:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(99,102,241,.4)}
.ai-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1000;justify-content:center;align-items:flex-start;padding:60px 16px}
.ai-modal.open{display:flex}
.ai-modal-body{background:#fff;border-radius:12px;max-width:700px;width:100%;max-height:80vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:aiSlide .25s ease-out}
@keyframes aiSlide{from{transform:translateY(-20px);opacity:0}to{transform:translateY(0);opacity:1}}
.ai-modal-head{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid #e5e7eb;background:#f8fafc;border-radius:12px 12px 0 0}
.ai-modal-head h3{font-size:15px;margin:0;color:#1e293b}
.ai-close{border:none;background:none;font-size:20px;cursor:pointer;color:#94a3b8;padding:0 4px}
.ai-close:hover{color:#1e293b}
#ai-modal-content{padding:16px 18px;font-size:13px;line-height:1.7;color:#334155}
@media print {
  body > * { display: none !important; }
  body > #ai-modal, body > #ai-modal * { display: block !important; visibility: visible !important; }
  #ai-modal { position: absolute; left: 0; top: 0; width: 100%; height: auto; background: none !important; display: block !important; }
  .ai-modal-body { box-shadow: none !important; max-height: none !important; overflow: visible !important; width: 100% !important; max-width: none !important; padding: 0 !important; }
  .ai-close, .ai-btn { display: none !important; }
}
</style>
</head>
<body>
<div id="loading">⏳ กำลังโหลดข้อมูล...</div>

<div class="ai-bar">
  <span class="ai-label">✨ AI Analysis:</span>
  <button class="ai-btn" onclick="aiAnalyze('aging')">📦 วิเคราะห์ Aging</button><button class="ai-btn" onclick="aiAnalyze('topvalue')">💰 มูลค่าค้างสต็อกสูง</button><button class="ai-btn" onclick="aiAnalyze('category')">📊 แยกตามประเภท</button><button class="ai-btn" onclick="aiAnalyze('action')">🎯 แนะนำ Action</button>
  <button class="ai-btn" style="background:linear-gradient(135deg,#e11d48,#be123c);margin-left:auto;" onclick="openExecutiveReport()">📋 Executive Report</button>
</div>

<div class="hdr">
  <h1>📦 Dead Stock Dashboard</h1>
  <span id="hdr-sub" class="sub"></span>
</div>

<div class="kpi-row" id="kpi-row">
  <div class="kpi red"><div class="label">สินค้าค้างสต็อก</div><div class="value" id="k-products">—</div></div>
  <div class="kpi orange"><div class="label">มูลค่ารวม (฿)</div><div class="value" id="k-value">—</div></div>
  <div class="kpi blue"><div class="label">จำนวนชิ้นรวม</div><div class="value" id="k-qty">—</div></div>
  <div class="kpi" id="k-filter-card"><div class="label">หลังกรอง</div><div class="value" id="k-filtered">—</div></div>
</div>

<div class="filters">
  <label>ค้างนาน:</label>
  <select id="f-days">
    <option value="0">ทั้งหมด (≥90 วัน)</option>
    <option value="180">≥ 180 วัน</option>
    <option value="365">≥ 365 วัน</option>
    <option value="-1">ไม่เคยขาย</option>
  </select>
  <label>ประเภท:</label>
  <select id="f-type"><option value="">ทั้งหมด</option></select>
  <label>กลุ่มสินค้า:</label>
  <select id="f-group"><option value="">ทั้งหมด</option></select>
  <label>ค้นหา:</label>
  <input id="f-search" type="text" placeholder="ชื่อ / parcode..." style="width:180px">
  <button class="btn btn-clear" onclick="clearFilters()">ล้าง</button>
  <button class="btn btn-xlsx" onclick="exportXLSX()">⬇ XLSX</button>
</div>

<div class="tbl-wrap">
<table id="main-tbl">
  <thead>
    <tr>
      <th style="width:24px"></th>
      <th data-col="iprod">Parcode</th>
      <th data-col="name">ชื่อสินค้า</th>
      <th data-col="group">กลุ่ม</th>
      <th data-col="type_name">ประเภท</th>
      <th data-col="last_sale">วันขายล่าสุด</th>
      <th data-col="days_since" class="r sort-desc">วันค้าง</th>
      <th data-col="onhand_qty" class="r">Onhand (ชิ้น)</th>
      <th data-col="onhand_value" class="r">มูลค่า (฿)</th>
      <th data-col="stores_count" class="r">ร้าน</th>
    </tr>
  </thead>
  <tbody id="tbody"></tbody>
  <tfoot id="tfoot"><tr><td colspan="10" class="no-data">โหลด...</td></tr></tfoot>
</table>
</div>

<script>
let ALL = [], FILTERED = [], SORT_COL = 'days_since', SORT_DIR = -1, META = {}, SUMMARY = {}, STORE_INFO = {};
const fmt  = n => n == null ? '—' : Number(n).toLocaleString('th-TH', {maximumFractionDigits:0});
const fmtD = n => n == null ? '—' : Number(n).toLocaleString('th-TH', {maximumFractionDigits:2});

function daysBadge(d){
  if(d == null) return '<span class="badge never">ไม่เคยขาย</span>';
  if(d >= 365)  return `<span class="badge d365">${d} วัน</span>`;
  if(d >= 180)  return `<span class="badge d180">${d} วัน</span>`;
  return `<span class="badge d90">${d} วัน</span>`;
}

function render(){
  const tbody = document.getElementById('tbody');
  const tfoot = document.getElementById('tfoot');
  if(!FILTERED.length){
    tbody.innerHTML = '';
    tfoot.innerHTML = '<tr><td colspan="10" class="no-data">ไม่พบข้อมูล</td></tr>';
    document.getElementById('k-filtered').textContent = '0';
    return;
  }

  // sort
  FILTERED.sort((a,b)=>{
    let av = a[SORT_COL], bv = b[SORT_COL];
    if(av == null) av = SORT_DIR > 0 ? -Infinity : Infinity;
    if(bv == null) bv = SORT_DIR > 0 ? -Infinity : Infinity;
    return SORT_DIR * (av < bv ? -1 : av > bv ? 1 : 0);
  });

  const rows = [];
  FILTERED.slice(0, 2000).forEach((p, i) => {
    rows.push(`<tr>
      <td><span class="expand-btn" onclick="toggleDetail(${i})" id="exp-${i}">▶</span></td>
      <td>${p.iprod}</td>
      <td>${p.name || '—'}</td>
      <td title="${p.group||''}">${p.group_name || p.group || '—'}</td>
      <td>${p.type_name || '—'}</td>
      <td>${p.last_sale || '—'}</td>
      <td class="r">${daysBadge(p.days_since)}</td>
      <td class="r">${fmtD(p.onhand_qty)}</td>
      <td class="r">${fmt(p.onhand_value)}</td>
      <td class="r">${p.stores ? p.stores.length : 0}</td>
    </tr>
    <tr id="detail-${i}" style="display:none"><td colspan="10" style="padding:0 10px 8px 32px">
      <table class="sub-tbl">
        <thead><tr><th>รหัส</th><th>ร้าน</th><th>DM</th><th>RM</th><th class="r">Onhand</th><th class="r">มูลค่า (฿)</th></tr></thead>
        <tbody>${(p.stores||[]).map(s=>`<tr>
          <td>${s.code}</td><td>${s.name}</td><td>${s.dm}</td><td>${s.rm}</td>
          <td class="r">${fmtD(s.qty)}</td><td class="r">${fmt(s.value)}</td>
        </tr>`).join('')}</tbody>
      </table>
    </td></tr>`);
  });
  tbody.innerHTML = rows.join('');

  // totals
  const totQty = FILTERED.reduce((s,p)=>s+p.onhand_qty,0);
  const totVal = FILTERED.reduce((s,p)=>s+p.onhand_value,0);
  tfoot.innerHTML = `<tr>
    <td colspan="5"></td>
    <td colspan="1" style="color:var(--muted);font-size:11px">${FILTERED.length.toLocaleString()} รายการ${FILTERED.length>2000?' (แสดง 2,000 แรก)':''}</td>
    <td></td>
    <td class="r">${fmtD(totQty)}</td>
    <td class="r">${fmt(totVal)}</td>
    <td></td>
  </tr>`;
  document.getElementById('k-filtered').textContent = FILTERED.length.toLocaleString();
}

function toggleDetail(i){
  const row = document.getElementById(`detail-${i}`);
  const btn = document.getElementById(`exp-${i}`);
  if(row.style.display==='none'){row.style.display='';btn.textContent='▼';}
  else{row.style.display='none';btn.textContent='▶';}
}

function applyFilters(){
  const days   = parseInt(document.getElementById('f-days').value);
  const type   = document.getElementById('f-type').value;
  const group  = document.getElementById('f-group').value;
  const search = document.getElementById('f-search').value.trim().toLowerCase();
  FILTERED = ALL.filter(p => {
    if(days === -1 && p.last_sale !== null) return false;
    if(days > 0 && (p.days_since == null || p.days_since < days)) return false;
    if(type && p.type_code !== type) return false;
    if(group && p.group !== group) return false;
    if(search && !p.iprod.includes(search) && !(p.name||'').toLowerCase().includes(search)) return false;
    return true;
  });
  render();
}

function clearFilters(){
  document.getElementById('f-days').value = '0';
  document.getElementById('f-type').value = '';
  document.getElementById('f-group').value = '';
  document.getElementById('f-search').value = '';
  applyFilters();
}

// sort headers
document.querySelectorAll('thead th[data-col]').forEach(th => {
  th.addEventListener('click', () => {
    const col = th.dataset.col;
    if(SORT_COL === col) SORT_DIR *= -1;
    else { SORT_COL = col; SORT_DIR = -1; }
    document.querySelectorAll('thead th').forEach(t => t.classList.remove('sort-asc','sort-desc'));
    th.classList.add(SORT_DIR === 1 ? 'sort-asc' : 'sort-desc');
    render();
  });
});

// filter events
['f-days','f-type','f-group'].forEach(id => document.getElementById(id).addEventListener('change', applyFilters));
document.getElementById('f-search').addEventListener('input', applyFilters);

// XLSX export
function exportXLSX(){
  const rows = [['Parcode','ชื่อสินค้า','กลุ่ม','ประเภท','วันขายล่าสุด','วันค้าง','Onhand (ชิ้น)','มูลค่า (฿)','จำนวนร้าน']];
  FILTERED.forEach(p => rows.push([p.iprod, p.name||'', p.group_name||p.group||'', p.type_name||'', p.last_sale||'ไม่เคยขาย', p.days_since??'', p.onhand_qty, p.onhand_value, p.stores?p.stores.length:0]));
  // CSV fallback (no SheetJS in standalone HTML)
  const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const bom = '﻿';
  const blob = new Blob([bom+csv], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = `dead_stock_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
}

// load data
fetch('./dead_stock_data.json')
  .then(r => r.json())
  .then(data => {
    ALL = data.products || [];
    META = data._meta || {};
    SUMMARY = data.summary || {};
    STORE_INFO = data.store_info || {};

    document.getElementById('hdr-sub').textContent =
      `ข้อมูล ณ ${META.as_of||''} · threshold ${META.threshold_days||90} วัน · built by ${META.built_by||''}`;
    document.getElementById('k-products').textContent = (SUMMARY.total_products||0).toLocaleString();
    document.getElementById('k-value').textContent    = '฿' + fmt(SUMMARY.total_onhand_value);
    document.getElementById('k-qty').textContent      = fmtD(SUMMARY.total_onhand_qty);

    // populate type filter — show type_name (itycode), filter by itycode
    const typMap = {};
    ALL.forEach(p => { if(p.type_code) typMap[p.type_code] = p.type_name || p.type_code; });
    const tsel = document.getElementById('f-type');
    Object.keys(typMap).sort().forEach(code => {
      const o = document.createElement('option');
      o.value = code;
      o.textContent = typMap[code] ? `${typMap[code]} (${code})` : code;
      tsel.appendChild(o);
    });

    // populate group filter — show group_name (igrcode), filter by igrcode
    const grpMap = {};
    ALL.forEach(p => { if(p.group) grpMap[p.group] = p.group_name || p.group; });
    const sel = document.getElementById('f-group');
    Object.keys(grpMap).sort().forEach(code => {
      const o = document.createElement('option');
      o.value = code;
      o.textContent = grpMap[code] ? `${grpMap[code]} (${code})` : code;
      sel.appendChild(o);
    });

    FILTERED = [...ALL];
    render();
    document.getElementById('loading').style.display = 'none';
  })
  .catch(e => {
    document.getElementById('loading').textContent = '❌ โหลดข้อมูลไม่ได้: ' + e.message;
  });

function openAi(title,html){
  document.getElementById('ai-modal-title').textContent=title;
  document.getElementById('ai-modal-content').innerHTML=html;
  document.getElementById('ai-modal').classList.add('open');
}
function closeAi(){document.getElementById('ai-modal').classList.remove('open');}

function aiAnalyze(type){
  const prods = window.FILTERED || window.ALL_PRODUCTS || [];
  if(type==='aging'){
    const bins={};
    prods.forEach(p=>{const d=p.days_no_sale||0;const k=d>360?'> 360 วัน':d>180?'181-360 วัน':d>90?'91-180 วัน':'≤ 90 วัน';if(!bins[k])bins[k]={count:0,value:0};bins[k].count++;bins[k].value+=(p.last_cost||0)*(p.stock_qty||0);});
    let h='<p><b>Aging Analysis</b></p><table style="width:100%;font-size:12px;border-collapse:collapse"><tr style="background:#f1f5f9"><th style="padding:6px">ช่วงอายุ</th><th style="text-align:right;padding:6px">จำนวน SKU</th><th style="text-align:right;padding:6px">มูลค่า (฿)</th></tr>';
    Object.entries(bins).forEach(([k,v])=>{h+=`<tr style="border-bottom:1px solid #e5e7eb"><td style="padding:5px">${k}</td><td style="text-align:right;padding:5px">${v.count.toLocaleString()}</td><td style="text-align:right;padding:5px">${Math.round(v.value).toLocaleString()}</td></tr>`;});
    h+='</table>';
    openAi('📦 วิเคราะห์ Aging', h);
  } else {
    openAi('🔧 กำลังพัฒนา','<p>ฟีเจอร์นี้กำลังพัฒนา</p>');
  }
}

function openExecutiveReport() {
  var storeMap = {};
  ALL.forEach(function(p) {
    var sts = p.stores || [];
    sts.forEach(function(st) {
      var code = st.code;
      if (!storeMap[code]) {
        storeMap[code] = {
          qty: 0,
          value: 0,
          name: st.name || 'ไม่ระบุ',
          dm: st.dm || 'ไม่ระบุ',
          rm: st.rm || 'ไม่ระบุ'
        };
      }
      storeMap[code].qty += st.qty;
      storeMap[code].value += st.value;
    });
  });

  var storeList = Object.keys(storeMap).map(function(code) {
    var storeData = storeMap[code];
    return {
      code: code,
      name: storeData.name,
      dm: storeData.dm,
      rm: storeData.rm,
      qty: storeData.qty,
      value: storeData.value
    };
  });

  storeList.sort(function(a, b) { return b.value - a.value; });
  var top5 = storeList.slice(0, 5);

  var top5Rows = top5.map(function(s) {
    return '<tr style="border-bottom:1px solid #e2e8f0"><td style="padding:6px;font-weight:600">' + s.code + '</td><td style="padding:6px">' + s.name + '</td><td style="padding:6px">' + s.rm + '</td><td style="padding:6px">' + s.dm + '</td><td class="r" style="padding:6px">' + fmt(s.qty) + '</td><td class="r" style="padding:6px">' + fmt(s.value) + '</td></tr>';
  }).join('');

  var title = '📊 รายงานสรุปสำหรับผู้บริหาร (EXECUTIVE BOARD REPORT)';
  var html = '<div style="font-family:\'Sarabun\',sans-serif;color:#1e293b;padding:10px;line-height:1.6;">' +
    '<div style="text-align:center;margin-bottom:20px;border-bottom:2px solid #0f172a;padding-bottom:10px;">' +
    '<h2 style="font-size:18px;font-weight:700;margin-bottom:4px;">รายงานสรุปสำหรับผู้บริหาร (EXECUTIVE BOARD REPORT)</h2>' +
    '<p style="font-size:13px;color:#475569;margin-bottom:4px;">สรุปสุขภาพสินค้าคงคลัง เงินทุนหมุนเวียนจม และแผนปฏิบัติการระบายสินค้า</p>' +
    '<p style="font-size:12px;font-weight:700;color:#0f172a;">ข้อมูล ณ วันที่ ' + (META.as_of || '?') + ' (สินค้าค้างส่งมอบ ≥ ' + (META.threshold_days || '90') + ' วัน)</p>' +
    '</div>' +
    
    '<div style="margin-bottom:20px;">' +
    '<h3 style="font-size:14px;font-weight:700;color:#0f172a;margin-bottom:8px;border-left:4px solid #e11d48;padding-left:8px;">1. รายงานวิเคราะห์สุขภาพสินค้าคงคลังและเงินทุนหมุนเวียนจม (Inventory Health Analysis)</h3>' +
    '<p style="font-size:12px;margin-bottom:10px;">จากการเชื่อมโยงระบบ WMS กับสถิติความเร็วการขายย้อนหลัง พบข้อมูลวิเคราะห์สินค้าคงคลังค้างสะสมดังนี้:</p>' +
    '<ul style="font-size:12px;padding-left:20px;margin-bottom:10px;">' +
    '<li><b>สินค้าค้างสต็อกไม่มีการเคลื่อนไหว (SKU Count):</b> สะสมสูงถึง <b>' + (SUMMARY.total_products || 0).toLocaleString() + ' รายการ</b></li>' +
    '<li><b>จำนวนชิ้นคงคลังรวม (Total Quantity):</b> สะสม <b>' + fmtD(SUMMARY.total_onhand_qty) + ' ชิ้น</b></li>' +
    '<li><b>มูลค่าเงินทุนหมุนเวียนที่จมในคลัง (Total Value):</b> มีมูลค่ารวมสูงถึง <b>฿' + fmt(SUMMARY.total_onhand_value) + '</b></li>' +
    '</ul>' +
    '</div>' +
    
    '<div style="margin-bottom:20px;">' +
    '<h3 style="font-size:14px;font-weight:700;color:#0f172a;margin-bottom:8px;border-left:4px solid #e11d48;padding-left:8px;">2. รายชื่อสาขาที่มีมูลค่าสินค้าทุนจมสะสมสูงสุด 5 อันดับแรก (Top 5 Locked Inventory Branches)</h3>' +
    '<table style="width:100%;font-size:11px;border-collapse:collapse;margin-top:10px;">' +
    '<tr style="background:#f1f5f9;border-bottom:2px solid #cbd5e1;"><th style="padding:6px;text-align:left">รหัสสาขา</th><th style="padding:6px;text-align:left">ชื่อสาขา</th><th style="padding:6px;text-align:left">ภูมิภาค (RM)</th><th style="padding:6px;text-align:left">ผู้จัดการเขต (DM)</th><th class="r" style="padding:6px">Onhand (ชิ้น)</th><th class="r" style="padding:6px">มูลค่าสินค้าจม (฿)</th></tr>' +
    top5Rows +
    '</table>' +
    '</div>' +

    '<div style="margin-bottom:20px;">' +
    '<h3 style="font-size:14px;font-weight:700;color:#0f172a;margin-bottom:8px;border-left:4px solid #e11d48;padding-left:8px;">3. แผนปฏิบัติการระบายและปรับปรุงสินค้าคงคลัง (Inventory Liquidation Plan)</h3>' +
    '<ul style="font-size:12px;padding-left:20px;margin-bottom:10px;">' +
    '<li><b>การระบายสินค้าค้างคลัง (Dead Stock Liquidation):</b> จัดแคมเปญลดราคาสินค้าค้างคลังหน้าร้านลด 30-50% เพื่อเร่งเปลี่ยนสต๊อกจมเป็นกระแสเงินสดกลับคืนมา</li>' +
    '<li><b>การโอนย้ายกระจายสต๊อก (Inter-store Transfers):</b> สั่งการโยกย้ายถ่ายโอนสินค้ากลุ่ม Over Stock ในสาขาที่มีปัญหาสต๊อกบวมไปยังสาขาที่มีอัตราความเร็วการขายสูงกว่า</li>' +
    '<li><b>การระงับคำสั่งซื้อชั่วคราว (Purchase Order Caps):</b> ตั้งค่าระงับการออกใบสั่งซื้อ (PO Freeze) สำหรับรายการสินค้า SKU ที่มีจำนวนวันครอบคลุมความเร็วในการขายเกิน 180 วันขึ้นไป</li>' +
    '</ul>' +
    '</div>' +

    '<div style="margin-bottom:20px;">' +
    '<h3 style="font-size:14px;font-weight:700;color:#0f172a;margin-bottom:8px;border-left:4px solid #e11d48;padding-left:8px;">4. ตารางสรุปบทบาทการปฏิบัติงานผู้บริหาร (PDCA Management Action)</h3>' +
    '<ol style="font-size:12px;padding-left:20px;margin-bottom:10px;">' +
    '<li><b>วางแผน (Plan):</b> กำหนดเป้าหมายกู้ยอดขายรายภาคและฟื้นฟูสาขาเฝ้าระวังสีแดงร่วมกับ DMs</li>' +
    '<li><b>ปฏิบัติ (Do):</b> จัดสรรสินค้าขายดีและสินค้าอัตรากำไรขั้นต้นสูงเข้าสาขาเป้าหมาย</li>' +
    '<li><b>ตรวจสอบ (Check):</b> ติดตามและตรวจสอบมูลค่าสินค้าค้างคลัง/สินค้าขาดโอกาสขายเป็นรายสัปดาห์</li>' +
    '<li><b>ปรับปรุง (Act):</b> วิเคราะห์สินค้า Dead Stock เพื่อให้คลังปรับลด Safety Stock ในระบบ WMS ลง 50% ให้สอดคล้องกับความต้องการจริง</li>' +
    '</ol>' +
    '</div>' +
    
    '<div style="text-align:right;margin-top:20px;border-top:1px solid #cbd5e1;padding-top:10px;">' +
    '<button class="ai-btn" style="background:#475569;" onclick="window.print()">🖨️ พิมพ์รายงาน</button>' +
    '</div>' +
    '</div>';
    
  openAi(title, html);
}
</script>

<div class="ai-modal" id="ai-modal" onclick="if(event.target.id==='ai-modal')closeAi()">
  <div class="ai-modal-body">
    <div class="ai-modal-head">
      <h3 id="ai-modal-title">AI Analysis</h3>
      <button class="ai-close" onclick="closeAi()">✕</button>
    </div>
    <div id="ai-modal-content"></div>
  </div>
</div>
</body>
</html>
